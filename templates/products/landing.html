<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>E-Commerce Product Recommendation System</title>
    <meta name="description" content="E-Commerce Product Recommendation System — Next-Gen Smart Shopping Platform">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700;800;900&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- Bootstrap 5.3 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <style>
        :root {
            --teal-primary: #0d9488;
            --teal-dark: #0f766e;
            --teal-light: #14b8a6;
            --coral-accent: #f97316;
            --dark-heading: #0f172a;
            --text-body: #334155;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html, body {
            height: 100%;
            width: 100%;
            overflow: hidden;
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #069c9b;
            color: var(--dark-heading);
        }

        h1, .brand-text {
            font-family: 'Outfit', sans-serif;
        }

        /* Fullscreen Hero Landing Screen */
        .landing-screen {
            position: relative;
            height: 100vh;
            width: 100vw;
            background: 
                radial-gradient(circle at 25% 50%, rgba(255, 255, 255, 0.25) 0%, rgba(255, 255, 255, 0) 60%),
                url('/static/images/shopping_hero.jpg') center center / cover no-repeat;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        /* Top Header Navigation */
        .landing-header {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            padding: 24px 44px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 100;
        }

        @media (max-width: 768px) {
            .landing-header {
                padding: 16px 20px;
            }
        }

        .brand-capsule {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            background: rgba(255, 255, 255, 0.94);
            backdrop-filter: blur(12px);
            padding: 8px 22px;
            border-radius: 9999px;
            text-decoration: none;
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.8);
            transition: all 0.25s ease;
        }

        .brand-capsule:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.12);
        }

        .brand-capsule i {
            font-size: 1.6rem;
            color: var(--teal-primary);
        }

        .brand-capsule .brand-name {
            font-size: 1.4rem;
            font-weight: 800;
            color: var(--dark-heading);
            letter-spacing: -0.5px;
        }

        .brand-capsule .brand-name span {
            color: var(--teal-primary);
        }

        /* Top Right Login Button - Matching reference screenshot style */
        .btn-top-login {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: linear-gradient(135deg, #0d9488 0%, #0f766e 100%);
            color: #ffffff !important;
            padding: 10px 26px;
            font-size: 0.95rem;
            font-weight: 700;
            border-radius: 9999px;
            text-decoration: none;
            box-shadow: 0 6px 20px rgba(13, 148, 136, 0.45);
            border: 1px solid rgba(255, 255, 255, 0.4);
            transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .btn-top-login:hover {
            background: linear-gradient(135deg, #0f766e 0%, #115e59 100%);
            box-shadow: 0 8px 26px rgba(13, 148, 136, 0.65);
            transform: translateY(-2px);
            color: #ffffff;
        }

        .btn-top-user {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: rgba(255, 255, 255, 0.94);
            border: 1px solid rgba(13, 148, 136, 0.3);
            color: var(--dark-heading) !important;
            padding: 8px 20px;
            border-radius: 9999px;
            font-size: 0.92rem;
            font-weight: 600;
            text-decoration: none;
            backdrop-filter: blur(8px);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
            transition: all 0.25s ease;
        }

        .btn-top-user:hover {
            transform: translateY(-2px);
            color: var(--teal-primary) !important;
        }

        /* Center Content Area */
        .landing-content {
            height: 100%;
            display: flex;
            align-items: center;
            padding: 0 60px;
            z-index: 10;
        }

        @media (max-width: 992px) {
            .landing-content {
                padding: 0 30px;
            }
        }

        /* Left Content Box aligned with the geometric frame */
        .hero-left-box {
            max-width: 620px;
            background: rgba(255, 255, 255, 0.88);
            backdrop-filter: blur(14px);
            padding: 42px 46px;
            border-radius: 28px;
            border: 2px solid #ffffff;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.12), 0 0 0 1px rgba(13, 148, 136, 0.1);
            animation: fadeIn 0.8s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @media (max-width: 576px) {
            .hero-left-box {
                padding: 28px 22px;
                border-radius: 20px;
            }
        }

        /* Main Headline - Matches dual-style typography */
        .hero-main-title {
            font-size: 3.4rem;
            font-weight: 900;
            line-height: 1.12;
            letter-spacing: -1.2px;
            margin-bottom: 28px;
        }

        @media (max-width: 768px) {
            .hero-main-title {
                font-size: 2.5rem;
            }
        }

        @media (max-width: 480px) {
            .hero-main-title {
                font-size: 2.1rem;
            }
        }

        .title-teal {
            color: var(--teal-primary);
        }

        .title-dark {
            color: var(--dark-heading);
        }

        /* Two Primary Action Buttons - Matches reference screenshot */
        .hero-button-group {
            display: flex;
            align-items: center;
            gap: 16px;
            flex-wrap: wrap;
        }

        /* "Get Started" Primary Button */
        .btn-action-primary {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            background: linear-gradient(135deg, #0d9488 0%, #0f766e 100%);
            color: #ffffff;
            font-size: 1.05rem;
            font-weight: 700;
            padding: 13px 34px;
            border-radius: 9999px;
            text-decoration: none;
            box-shadow: 0 8px 24px rgba(13, 148, 136, 0.45);
            border: 1px solid rgba(255, 255, 255, 0.3);
            transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .btn-action-primary:hover {
            background: linear-gradient(135deg, #0f766e 0%, #115e59 100%);
            box-shadow: 0 10px 30px rgba(13, 148, 136, 0.6);
            transform: translateY(-2px);
            color: #ffffff;
        }

        /* "Create Account" Secondary Clean Button */
        .btn-action-secondary {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            background: #ffffff;
            border: 1.5px solid #cbd5e1;
            color: var(--dark-heading);
            font-size: 1.05rem;
            font-weight: 700;
            padding: 13px 30px;
            border-radius: 9999px;
            text-decoration: none;
            box-shadow: 0 4px 14px rgba(0, 0, 0, 0.06);
            transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .btn-action-secondary:hover {
            background: #f8fafc;
            border-color: var(--teal-primary);
            color: var(--teal-primary);
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.1);
        }
    </style>
</head>
<body>

    <div class="landing-screen">
        
        <!-- Top Navigation -->
        <header class="landing-header">
            <a href="{% url 'landing' %}" class="brand-capsule">
                <i class="bi bi-cart4"></i>
                <span class="brand-name">Shop<span>Smart</span></span>
            </a>

            <div>
                {% if user.is_authenticated %}
                    <a href="{% url 'profile' %}" class="btn-top-user">
                        <i class="bi bi-person-circle text-teal"></i>
                        <span>{{ user.first_name|default:user.username }}</span>
                    </a>
                    <a href="{% url 'home' %}" class="btn-top-login ms-2">
                        <i class="bi bi-bag-check"></i>
                        <span>Storefront</span>
                    </a>
                {% else %}
                    <a href="{% url 'login' %}" class="btn-top-login">
                        <i class="bi bi-box-arrow-in-right"></i>
                        <span>Login</span>
                    </a>
                {% endif %}
            </div>
        </header>

        <!-- Center Hero Content (Placed cleanly in geometric frame) -->
        <main class="landing-content">
            <div class="hero-left-box">
                <h1 class="hero-main-title">
                    <span class="title-teal">E-Commerce Product</span><br>
                    <span class="title-dark">Recommendation System</span>
                </h1>

                <div class="hero-button-group">
                    <a href="{% url 'login' %}" class="btn-action-primary">
                        <i class="bi bi-rocket-takeoff-fill"></i>
                        <span>Get Started</span>
                    </a>

                    <a href="{% url 'register' %}" class="btn-action-secondary">
                        <i class="bi bi-person-fill-add"></i>
                        <span>Create Account</span>
                    </a>
                </div>
            </div>
        </main>

    </div>

    <!-- Bootstrap 5.3 JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
